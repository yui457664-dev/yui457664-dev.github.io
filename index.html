<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background:#ffe6f2; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; overflow:hidden; font-family:sans-serif; flex-direction:column; }
.cat { font-size:100px; animation: joget 0.5s infinite alternate; }
@keyframes joget {
  0% { transform: translateY(0) rotate(-10deg) scale(1); }
  100% { transform: translateY(-20px) rotate(10deg) scale(1.1); }
}
h1 { color:#ff3399; animation: warna 1s infinite; }
@keyframes warna {
  0% { color:#ff3399; } 50% { color:#ffcc00; } 100% { color:#ff3399; }
}
.hearts { position:absolute; width:100%; height:100%; pointer-events:none; }
.heart { position:absolute; animation: jatuh 3s linear infinite; font-size:30px; }
@keyframes jatuh {
  0% { top:-10%; } 100% { top:110%; }
}
</style>
</head>
<body>
<h1>KUCING JOGET BUAT SYNG KUH! 😍</h1>
<div class="cat">🐱💃</div>
<p>Klik kucingnya syng!</p>
<div class="hearts" id="hearts"></div>

<script>
document.querySelector('.cat').onclick = function(){
  this.style.animation = 'joget 0.1s infinite alternate';
  for(let i=0;i<20;i++){
    let h = document.createElement('div');
    h.className='heart'; h.innerHTML='❤️';
    h.style.left=Math.random()*100+'%';
    h.style.animationDelay=Math.random()+'s';
    document.getElementById('hearts').appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
  setTimeout(()=>{ this.style.animation='joget 0.5s infinite alternate'; },2000);
}
</script>
</body>
</html>
